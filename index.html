<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="board">
        <div class="column" id="to-do">
            <h2>To Do</h2>
            <div class="tasks" id="to-do-tasks"></div>
        </div>
        <div class="column" id="in-progress">
            <h2>In Progress</h2>
            <div class="tasks" id="in-progress-tasks"></div>
        </div>
        <div class="column" id="completed">
            <h2>Completed</h2>
            <div class="tasks" id="completed-tasks"></div>
        </div>
    </div>
    <button id="create-task-btn">Create Task</button>
    <div class="modal" id="create-task-modal">
        <div class="modal-content">
            <h2>Create Task</h2>
            <form id="create-task-form">
                <label for="task-name">Task Name:</label>
                <input type="text" id="task-name" name="task-name"><br><br>
                <label for="task-description">Task Description:</label>
                <textarea id="task-description" name="task-description"></textarea><br><br>
                <button id="submit-task-btn">Create</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

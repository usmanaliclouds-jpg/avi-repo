<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SaaS Analytics Platform</title><link rel="stylesheet" href="styles.css"></head><body><header><nav><button id="theme-toggle" aria-label="Toggle theme">Toggle Theme</button></nav></header><main><section class="metric-summary"><h2>Key Metrics</h2><div class="metric-cards"><div class="metric-card"><h3>Monthly Revenue</h3><p id="monthly-revenue"></p></div><div class="metric-card"><h3>Active Subscribers</h3><p id="active-subscribers"></p></div><div class="metric-card"><h3>Conversion Rate</h3><p id="conversion-rate"></p></div><div class="metric-card"><h3>System Uptime</h3><p id="system-uptime"></p></div></div></section><section class="chart-widget"><h2>Interactive Chart</h2><canvas id="chart"></canvas></section><section class="data-filters"><h2>Filter Data</h2><form><label for="date-range">Date Range:</label><input type="date" id="date-range" name="date-range"><label for="filter-type">Filter Type:</label><select id="filter-type" name="filter-type"><option value="all">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select><button id="apply-filters" aria-label="Apply filters">Apply Filters</button></form></section><section class="user-data-table"><h2>User Data Table</h2><input type="search" id="search-input" placeholder="Search users..."><table id="user-data-table"><thead><tr><th>User ID</th><th>Name</th><th>Email</th></tr></thead><tbody id="user-data-table-body"></tbody></table></section><script src="script.js"></script></body></html>

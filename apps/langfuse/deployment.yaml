apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: ai-platform
  labels:
    app: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:2
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres_secure_dev_password@postgres.ai-platform.svc.cluster.local:5432/aiplatform"
            - name: NEXTAUTH_SECRET
              value: "langfuse_dev_secret_nextauth_32char"
            - name: SALT
              value: "langfuse_dev_salt_secret_16char"
            - name: NEXTAUTH_URL
              value: "http://langfuse.ai-platform.svc.cluster.local:3000"
            - name: TELEMETRY_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: ai-platform
  labels:
    app: langfuse
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: langfuse

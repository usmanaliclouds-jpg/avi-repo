apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-operator
  namespace: platform
  labels:
    app: keda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda
  template:
    metadata:
      labels:
        app: keda
    spec:
      containers:
        - name: keda-operator
          image: busybox:latest
          command: ["sh", "-c", "echo KEDA Autoscaler Controller Active && sleep infinity"]
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/usmanaliclouds-jpg/avi-repo'
    targetRevision: HEAD
    path: apps/cert-manager
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

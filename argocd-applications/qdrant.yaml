apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant
  namespace: gitops
spec:
  project: default
  source:
    repoURL: "https://github.com/usmanaliclouds-jpg/avi-repo"
    targetRevision: HEAD
    path: apps/qdrant
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
